<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#047857" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#emeraldGrad)"/>
  
  <!-- Subtle Scan Grid Background Pattern -->
  <path d="M10 14h44M10 50h44" stroke="#34D399" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Paper Sheet -->
  <path d="M22 13h15l10 10v20a3 3 0 0 1-3 3H22a3 3 0 0 1-3-3V16a3 3 0 0 1 3-3z" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Folded Corner -->
  <path d="M37 13v7a3 3 0 0 0 3 3h7" fill="none" stroke="#E2E8F0" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M37 13l10 10" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>

  <!-- Scanner Light Bar (Emerald Accent) -->
  <line x1="23" y1="27" x2="41" y2="27" stroke="#059669" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Document Lines -->
  <line x1="23" y1="32" x2="37" y2="32" stroke="#94A3B8" stroke-width="1.75" stroke-linecap="round"/>
  <line x1="23" y1="37" x2="34" y2="37" stroke="#CBD5E1" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Printer Base / Tray Slot -->
  <path d="M16 43h32a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2H16a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2z" fill="#0F172A"/>
  <line x1="24" y1="46" x2="40" y2="46" stroke="#10B981" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Scan Target Corners (subtle motif) -->
  <path d="M12 18v-4h4" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 14h4v4" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M12 46v4h4" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
  <path d="M48 50h4v-4" stroke="#A7F3D0" stroke-width="2" stroke-linecap="round"/>
</svg>