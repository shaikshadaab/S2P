<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="emeraldGradH" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(4, 8)">
    <rect width="48" height="48" rx="11" fill="url(#emeraldGradH)"/>
    
    <!-- Paper Sheet -->
    <path d="M17 10h11l8 8v15a2 2 0 0 1-2 2H17a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2z" fill="#FFFFFF"/>
    <path d="M28 10v6a2 2 0 0 0 2 2h6" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
    
    <!-- Scanner Bar -->
    <line x1="18" y1="20" x2="32" y2="20" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="29" y2="24" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="18" y1="28" x2="26" y2="28" stroke="#CBD5E1" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Printer Tray Base -->
    <rect x="12" y="33" width="24" height="5" rx="1.5" fill="#0F172A"/>
    <line x1="18" y1="35.5" x2="30" y2="35.5" stroke="#10B981" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Scan Corners -->
    <path d="M9 13v-3h3" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M36 10h3v3" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M9 35v3h3" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M36 38h3v-3" stroke="#A7F3D0" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Typography (Right) -->
  <g transform="translate(64, 0)">
    <!-- SOS Wordmark -->
    <text x="0" y="34" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#0F172A" letter-spacing="0.05em">
      SOS <tspan fill="#059669">PRINT</tspan>
    </text>
    
    <!-- Subtitle -->
    <text x="1" y="48" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="10" fill="#64748B" letter-spacing="0.14em">
      SHAKEEL ONLINE SERVICES, GUNTUR
    </text>
  </g>
</svg>